<div class="modal-backdrop" (click)="onBackdropClick()">

  <div
    class="ocr-toast"
    *ngIf="ocrMessage"
    [class.error]="ocrMessageType === 'error'"
    [class.success]="ocrMessageType === 'success'"
    [class.loading]="ocrMessageType === 'loading'">
    {{ ocrMessage }}
  </div>

  <div class="modal" (click)="onDialogClick($event)">
    <div class="modal-header">
      <h2>{{ title }}</h2>
      <button class="icon-btn" type="button" (click)="close.emit()">✕</button>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <div class="modal-body" [ngSwitch]="mode">

        <!-- CREDIT -->
        <ng-container *ngSwitchCase="'credit'">
          <label class="field">
            <span>Store</span>

            <select formControlName="storeId" [disabled]="loadingStores || storesError">
              <option [ngValue]="null" disabled>
                {{
                  loadingStores
                    ? 'Loading stores...'
                    : (storesError ? 'Could not load stores' : 'Select a store...')
                }}
              </option>

              <option *ngFor="let s of stores" [ngValue]="s.storeId">
                {{ s.storeNumber }} - {{ s.storeName }}
              </option>
            </select>

            <small class="error" *ngIf="storesError">
              Could not load stores.
              <button type="button" class="link" (click)="loadStores()">Retry</button>
            </small>

            <small class="error" *ngIf="form.controls.storeId.touched && form.controls.storeId.invalid && !storesError">
              Store is required
            </small>
          </label>

          <label class="field">
            <span>Approved?</span>

            <select formControlName="approved">
              <option [ngValue]="null" disabled>Select...</option>
              <option [ngValue]="true">Approved</option>
              <option [ngValue]="false">Not approved</option>
            </select>

            <small class="error" *ngIf="form.controls.approved.touched && form.controls.approved.invalid">
              Approval status is required
            </small>
          </label>
        </ng-container>

        <!-- MEMBERSHIP -->
        <ng-container *ngSwitchCase="'membership'">
          <label class="field">
            <span>Store</span>

            <select formControlName="storeId" [disabled]="loadingStores || storesError">
              <option [ngValue]="null" disabled>
                {{
                  loadingStores
                    ? 'Loading stores...'
                    : (storesError ? 'Could not load stores' : 'Select a store...')
                }}
              </option>

              <option *ngFor="let s of stores" [ngValue]="s.storeId">
                {{ s.storeNumber }} - {{ s.storeName }}
              </option>
            </select>

            <small class="error" *ngIf="storesError">
              Could not load stores.
              <button type="button" class="link" (click)="loadStores()">Retry</button>
            </small>

            <small class="error" *ngIf="form.controls.storeId.touched && form.controls.storeId.invalid && !storesError">
              Store is required
            </small>
          </label>

          <label class="field">
            <span>Membership</span>

            <select formControlName="membershipProductId" [disabled]="loadingMemberships || membershipsError">
              <option [ngValue]="null" disabled>
                {{
                  loadingMemberships
                    ? 'Loading memberships...'
                    : (membershipsError ? 'Could not load memberships' : 'Select membership...')
                }}
              </option>

              <option *ngFor="let m of membershipProducts" [ngValue]="m.membershipProductId">
                {{ m.productName }}
              </option>
            </select>

            <small class="error" *ngIf="membershipsError">
              Could not load memberships.
              <button type="button" class="link" (click)="loadMembershipProducts()">Retry</button>
            </small>

            <small class="error"
              *ngIf="form.controls.membershipProductId.touched && form.controls.membershipProductId.invalid && !membershipsError">
              Membership is required
            </small>
          </label>

          <label class="field">
            <span>Term (months)</span>

            <input type="number" formControlName="termMonths" placeholder="e.g. 12" />

            <small class="error" *ngIf="form.controls.termMonths.touched && form.controls.termMonths.invalid">
              Term must be 1+ months
            </small>
          </label>
        </ng-container>

        <!-- SALE -->
        <ng-container *ngSwitchCase="'sale'">
          <div class="sale-fields-grid">

            <label class="field">
              <span>Receipt / Ticket</span>

              <input
                #receiptInput
                type="file"
                accept="image/*"
                class="hidden-file-input"
                (change)="onReceiptSelected($event)" />

              <button
                type="button"
                class="receipt-upload-btn"
                (click)="receiptInput.click()">
                <i class="fa-solid fa-camera"></i>
                <span>Upload Receipt</span>
              </button>
            </label>

            <label class="field">
              <span>Store</span>

              <select formControlName="storeId" [disabled]="loadingStores || storesError">
                <option [ngValue]="null" disabled>
                  {{
                    loadingStores
                      ? 'Loading stores...'
                      : (storesError ? 'Could not load stores' : 'Select a store...')
                  }}
                </option>

                <option *ngFor="let s of stores" [ngValue]="s.storeId">
                  {{ s.storeName }}
                </option>
              </select>

              <small class="error" *ngIf="storesError">
                Could not load stores.
                <button type="button" class="link" (click)="loadStores()">Retry</button>
              </small>

              <small class="error"
                *ngIf="form.controls.storeId.touched && form.controls.storeId.invalid && !storesError">
                Store is required
              </small>
            </label>

            <label class="field">
              <span>Sale Amount</span>

              <input type="number" step="0.01" formControlName="saleAmount" placeholder="e.g. 199.99" />

              <small class="error" *ngIf="form.controls.saleAmount.touched && form.controls.saleAmount.invalid">
                Amount is required
              </small>
            </label>

            <label class="field">
              <span>Tax</span>

              <input type="number" step="0.01" formControlName="taxAmount" placeholder="e.g. 19.99" />

              <small class="error" *ngIf="form.controls.taxAmount.touched && form.controls.taxAmount.invalid">
                Tax must be 0 or more
              </small>
            </label>

            <label class="field">
              <span>Total</span>

              <input type="number" step="0.01" formControlName="totalAmount" placeholder="e.g. 219.98" />

              <small class="error" *ngIf="form.controls.totalAmount.touched && form.controls.totalAmount.invalid">
                Total is required
              </small>
            </label>

            <label class="field">
              <span>Payment Method</span>

              <select formControlName="paymentMethod">
                <option [ngValue]="null" disabled>Select...</option>

                <option *ngFor="let method of paymentMethods" [ngValue]="method">
                  {{ method }}
                </option>
              </select>

              <small class="error" *ngIf="form.controls.paymentMethod.touched && form.controls.paymentMethod.invalid">
                Payment method is required
              </small>
            </label>

            <label class="field field-full">
              <span>Notes (optional)</span>

              <textarea
                rows="4"
                formControlName="notes"
                placeholder="Tax, total, payment method..."></textarea>
            </label>

          </div>
        </ng-container>

      </div>

      <div class="modal-footer">
        <button type="button" class="btn-secondary" (click)="close.emit()">
          Cancel
        </button>

        <button type="submit" class="btn-secondary">
          Save
        </button>
      </div>
    </form>
  </div>
</div>
